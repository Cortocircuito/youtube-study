[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "data_run"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["src/youtube_study"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
